<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#092b49"/>
  <!-- Palm trees -->
  <line x1="140" y1="400" x2="140" y2="240" stroke="#ceb684" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="400" x2="256" y2="180" stroke="#ceb684" stroke-width="14" stroke-linecap="round"/>
  <line x1="372" y1="400" x2="372" y2="240" stroke="#ceb684" stroke-width="14" stroke-linecap="round"/>
  <!-- Left tree fronds -->
  <ellipse cx="100" cy="200" rx="52" ry="20" fill="#ffffff" opacity="0.9" transform="rotate(-42 100 200)"/>
  <ellipse cx="75" cy="222" rx="44" ry="16" fill="#ffffff" opacity="0.65" transform="rotate(-20 75 222)"/>
  <ellipse cx="180" cy="200" rx="52" ry="20" fill="#ffffff" opacity="0.9" transform="rotate(42 180 200)"/>
  <ellipse cx="205" cy="222" rx="44" ry="16" fill="#ffffff" opacity="0.65" transform="rotate(20 205 222)"/>
  <ellipse cx="140" cy="192" rx="44" ry="16" fill="#ffffff" opacity="0.75"/>
  <!-- Center tree fronds -->
  <ellipse cx="196" cy="136" rx="62" ry="24" fill="#ffffff" opacity="0.92" transform="rotate(-42 196 136)"/>
  <ellipse cx="165" cy="164" rx="52" ry="20" fill="#ffffff" opacity="0.68" transform="rotate(-20 165 164)"/>
  <ellipse cx="316" cy="136" rx="62" ry="24" fill="#ffffff" opacity="0.92" transform="rotate(42 316 136)"/>
  <ellipse cx="347" cy="164" rx="52" ry="20" fill="#ffffff" opacity="0.68" transform="rotate(20 347 164)"/>
  <ellipse cx="256" cy="126" rx="52" ry="20" fill="#ffffff" opacity="0.78"/>
  <!-- Right tree fronds -->
  <ellipse cx="332" cy="200" rx="52" ry="20" fill="#ffffff" opacity="0.9" transform="rotate(-42 332 200)"/>
  <ellipse cx="307" cy="222" rx="44" ry="16" fill="#ffffff" opacity="0.65" transform="rotate(-20 307 222)"/>
  <ellipse cx="412" cy="200" rx="52" ry="20" fill="#ffffff" opacity="0.9" transform="rotate(42 412 200)"/>
  <ellipse cx="437" cy="222" rx="44" ry="16" fill="#ffffff" opacity="0.65" transform="rotate(20 437 222)"/>
  <ellipse cx="372" cy="192" rx="44" ry="16" fill="#ffffff" opacity="0.75"/>
  <!-- Ground line -->
  <line x1="80" y1="410" x2="432" y2="410" stroke="#ceb684" stroke-width="5" opacity="0.5"/>

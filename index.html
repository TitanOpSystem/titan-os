<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- %BRAND_*% tokens are replaced at build time by the brand-html plugin in
         vite.config.js, from VITE_BRAND_* env vars. Unset = TitanOS defaults. -->
    <meta name="theme-color" content="%BRAND_PRIMARY%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_SHORT%" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <title>%BRAND_NAME%</title>

    <!-- Link previews (iMessage, Slack, LinkedIn, WhatsApp, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:image" content="%BRAND_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_NAME%" />
    <meta name="twitter:description" content="%BRAND_DESCRIPTION%" />
    <meta name="twitter:image" content="%BRAND_OG_IMAGE%" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="%BRAND_FAVICON%" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BRAND_FAVICON_16%" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BRAND_FAVICON_32%" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BRAND_APPLE_ICON%" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BRAND_FAVICON_192%" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BRAND_FAVICON_512%" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(err => console.log('SW failed:', err));
        });
      }
    </script>
  </body>
</html>
